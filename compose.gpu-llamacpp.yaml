# GPU variant for NuExtract3 using llama.cpp's CUDA build (NVIDIA GPU; Docker Desktop with WSL2, or Linux with
# the NVIDIA Container Toolkit). Same Q4_K_M GGUF, request format and log-probabilities as the CPU service, so
# the model volume is reused and confidences behave the same; every layer is offloaded to the GPU (-ngl 99).
# Usage: docker compose -f compose.yaml -f compose.gpu-llamacpp.yaml up -d
# -c is shared by the parallel slots (each gets c / np), so keep NUEXTRACT_CTX = 32768 x NUEXTRACT_PARALLEL.
# If the server rejects --spec-type draft-mtp, remove that pair.
services:
  backend:
    environment:
      NUEXTRACT_PARALLEL: ${NUEXTRACT_PARALLEL:-2}

  nuextract:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    command: ["-hf", "numind/NuExtract3-GGUF:Q4_K_M", "--jinja", "--alias", "numind/NuExtract3",
              "-c", "${NUEXTRACT_CTX:-65536}", "-np", "${NUEXTRACT_PARALLEL:-2}", "-ngl", "99",
              "--spec-type", "draft-mtp", "--host", "0.0.0.0", "--port", "8080"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
