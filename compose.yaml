name: doc-cognition-langextract

services:
  backend:
    build: ./backend
    environment:
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
    expose:
      - "8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    mem_limit: 128m
